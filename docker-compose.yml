# Lab Sales Analysis : PostgreSQL (données de ventes) et Airflow (orchestration)
name: lab-sales-analysis

# Configuration commune aux services Airflow
x-airflow-common: &airflow-common
  image: apache/airflow:3.4.0
  env_file: ../data_connection/lab_sales_airflow.env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Messagerie de test : les mails partent vers Mailpit, sans mot de passe
    AIRFLOW_CONN_SMTP_DEFAULT: '{"conn_type": "smtp", "host": "mailpit", "port": 1025, "extra": {"from_email": "airflow@lab-sales.local", "disable_ssl": true, "disable_tls": true}}'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config:ro
  user: "50000:0"

services:

  # Base interne d'Airflow : historique des exécutions, non exposée
  postgres-airflow:
    image: postgres:17
    env_file: ../data_connection/lab_sales_postgres_airflow.env
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # Base des ventes : schémas bronze, silver, gold et ops
  postgres-ventes:
    image: postgres:17
    env_file: ../data_connection/lab_sales_postgres_ventes.env
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres-ventes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # Prépare la base interne d'Airflow, puis s'arrête
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    restart: "no"

  # Interface web et API d'Airflow
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on: &airflow-depends-on
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Déclenche les DAG et exécute leurs tâches (LocalExecutor)
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends-on
      postgres-ventes:
        condition: service_healthy
    restart: unless-stopped

  # Lit et analyse les fichiers du dossier dags/
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on: *airflow-depends-on
    restart: unless-stopped

  # Exécute les tâches différables (attente d'un événement sans bloquer de place)
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on: *airflow-depends-on
    restart: unless-stopped

  # Boîte mail de test : reçoit les alertes d'Airflow, consultable sur le port 8027
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8027:8025"
    restart: unless-stopped

  # Suivi des exécutions : lit ops.journal_taches et ops.journal_controles
  # avec le rôle grafana_lecture (lecture seule), sur le port 3002
  grafana:
    image: grafana/grafana:11.6.0
    env_file: ../data_connection/lab_sales_grafana.env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/lab_sales_executions.json
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres-ventes:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-airflow-data:
  postgres-ventes-data:
  grafana-data:
